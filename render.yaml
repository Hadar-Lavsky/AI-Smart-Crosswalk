# render.yaml — Render Blueprint for AI Smart Crosswalk
# Backend: Node/Express API (Web Service)
# Frontend: React/Vite app (Static Site)
# Docs: https://render.com/docs/blueprint-spec
services:
  # ---------------- Backend API ----------------
  - type: web
    name: aismartcrosswalk-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: smart-crosswalk/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secret — entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      # Frontend origin allowed by CORS (matches the static site URL below).
      - key: CORS_ORIGIN
        value: https://aismartcrosswalk-web.onrender.com

  # ---------------- Frontend (static site) ----------------
  - type: web
    name: aismartcrosswalk-web
    runtime: static
    rootDir: smart-crosswalk/frontend
    # --include=dev guarantees Vite (a devDependency) is installed for the build.
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      # Baked into the build so the React app calls the backend API.
      - key: VITE_API_URL
        value: https://aismartcrosswalk-api.onrender.com/api
    routes:
      # SPA fallback so client-side routes work on refresh / deep links.
      - type: rewrite
        source: /*
        destination: /index.html
